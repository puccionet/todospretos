<button onclick="toggleMusicX()"

          position:fixed; 
          left:50%
          right:50%;
          transform:translate(50%, 50%);
          z-index:9999;
          padding:15px 25px;
          background:#222;
          color:#fff;
          border:none;
          border-radius:25px; 
          cursor:pointer;
          font-size:18px;
          box-shadow:0 4px 15px rgba(0,0,0,0.5);
          min-width:160px;
        ">
▶️ Play</button>

<script>
function toggleMusicX() {
  const audio = document.getElementById('bgmusicX');
  const btn = event.target || window.event.target;  // Fix compatibilità
  if (audio.paused) {
    audio.play();
    btn.innerHTML = '&#9208; Pausa';  // ⏸️ emoji sicura
  } else {
    audio.pause();
    btn.innerHTML = '&#9654; Play';  // ▶️ emoji sicura
  }
}
</script>
